name: Docker

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write    

    steps:
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Docker Build
        run: docker build . -t sse-server

      - name: Docker Push
        run: |
          IMAGE_URL=ghcr.io/${{ github.repository }}
          IMAGE_URL=$(echo $IMAGE_URL | tr '[A-Z]' '[a-z]')
          
          # Strip "v" prefix from tag name
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "main" ] && VERSION=latest
          [ "${{ matrix.build }}" == "dev" ] && VERSION="${VERSION}-debug"

          docker tag sse-server $IMAGE_URL:$VERSION
          docker push $IMAGE_URL:$VERSION                          